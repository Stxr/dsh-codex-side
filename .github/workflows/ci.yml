name: Check plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Validate user-added plugin index
        if: ${{ hashFiles('dsh-plugin-index.json') != '' }}
        run: npm run index:check
      - name: Check committed runtime is reproducible
        run: git diff --exit-code -- runtime/
      - run: npm pack --ignore-scripts --dry-run
